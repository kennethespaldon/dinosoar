services:
  api:
    build: .
    ports:
      - 8080:8080
    environment:
      POSTGRES_DB: exampledb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: exampledb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./src/main/resources/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./src/main/resources/01-data.sql:/docker-entrypoint-initdb.d/01-data.sql