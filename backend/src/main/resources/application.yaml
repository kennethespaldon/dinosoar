spring:
  application:
    name: api
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none

aws:
  region: us-west-1
  s3:
    buckets:
      dinosoar: ${AWS_S3_BUCKET_NAME}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.results: TRACE
    org.springframework.web: DEBUG